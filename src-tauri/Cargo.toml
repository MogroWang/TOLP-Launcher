[package]
name = "tolp-launcher"
version = "0.5.1"
description = "光点之旅（Tour of Light Point）桌面启动器"
authors = ["MogroWang Studio"]
edition = "2021"

[lib]
name = "tolp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

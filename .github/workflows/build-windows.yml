name: Build Windows x64 (Portable)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows-portable:
    name: Windows x64 便携版
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建（前端 + Tauri 发布版，仅裸 exe，不打安装包）
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc

      - name: 打包便携版压缩包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/TOLP-Launcher.exe"
          if (-not (Test-Path $exe)) { throw "未找到构建产物：$exe" }
          $stage = "dist-portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe "$stage/TOLP-Launcher.exe"
          Copy-Item "game/README.txt" "$stage/README-游戏文件放置说明.txt"
          if (Test-Path "game/index.html") {
            Copy-Item "game" "$stage/game" -Recurse
          }
          $zip = "TOLP-Launcher_${version}_windows_x64_portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Write-Output "已打包 $zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TOLP-Launcher-windows-x64-portable
          path: TOLP-Launcher_*_windows_x64_portable.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TOLP-Launcher_*_windows_x64_portable.zip
          generate_release_notes: true
